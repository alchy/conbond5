[project]
name = "conbond5"
version = "0.1.0.dev0"
description = "conbond5 — konverzační systém s grafovou pamětí a logickým hodnocením výroků"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["cb5"]
ignore_missing_imports = true
